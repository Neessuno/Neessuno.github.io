  <style>
    :root { --bg: #0B0B0C; --ink: #F1EEC0; --muted: #8F8C80; --red: #F0563A; --blue: #4C8DFF; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body { background: var(--bg); color: var(--ink); font-family: "Inter Tight", system-ui, sans-serif; display: grid; place-items: center; text-align: center; padding: 24px 16px; }
    main { display: flex; flex-direction: column; align-items: center; }
    .code { font-family: Anton, Impact, sans-serif; font-size: clamp(6rem, 26vw, 15rem); line-height: .9; margin: 0; display: inline-flex; align-items: center; gap: .04em; }
    .code .r { color: var(--red); }
    .pp { font-family: "Bricolage Grotesque", sans-serif; font-weight: 200; font-size: .8em; }
    .g { width: .78em; height: .78em; animation: lost 2.6s ease-in-out infinite; transform-origin: 50% 80%; }
    @keyframes lost { 0%, 100% { transform: rotate(-14deg); } 50% { transform: rotate(14deg); } }
    h1 { font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; font-size: clamp(1.6rem, 4.5vw, 2.6rem); letter-spacing: -.02em; margin: 18px 0 8px; }
    h1 em { font-style: normal; color: var(--blue); }
    p { color: var(--muted); margin: 0 auto; max-width: 42ch; line-height: 1.5; }
    .mono { font-family: "JetBrains Mono", monospace; font-size: .8rem; letter-spacing: .03em; }
    .alarm { display: inline-flex; gap: 8px; align-items: center; color: var(--red); margin-bottom: 18px; }
    .alarm i { width: 8px; height: 8px; border-radius: 50%; background: var(--red); box-shadow: 0 0 10px var(--red); animation: blink 1s infinite; }
    @keyframes blink { 50% { opacity: .3; } }
    a.home { display: inline-block; margin-top: 30px; padding: 12px 22px; border-radius: 999px; background: var(--ink); color: var(--bg); font: 700 1.05rem "Bricolage Grotesque", sans-serif; text-decoration: none; transition: transform .2s, background .2s; }
    a.home:hover { background: var(--blue); transform: translateY(-2px) rotate(-1deg); }
    @media (prefers-reduced-motion: reduce) { .g, .alarm i { animation: none; } }
  </style>
</head>
